name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: web
        run: |
          npm install
          npm run build

  compose-demo:
    runs-on: ubuntu-latest
    needs: [unit, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          export FP_OFFLINE_LLM=1
          docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18000/health; then
              exit 0
            fi
            sleep 4
          done
          docker compose logs
          exit 1
      - name: Check /meta fault types
        run: |
          curl -sf http://localhost:18000/meta | tee /tmp/meta.json
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/meta.json"))
          assert m.get("service") == "factorypulse-api", m
          faults = m.get("fault_types") or []
          assert len(faults) >= 1, m
          print("meta ok", faults)
          PY
      - name: Inject, diagnose, list reports
        run: |
          curl -sf -X POST "http://localhost:18000/simulate/inject-fault?type=bearing_degradation" | tee /tmp/inject.json
          sleep 8
          eid=$(python3 -c 'import json; print(json.load(open("/tmp/inject.json"))["event"]["event_id"])')
          curl -sf -X POST "http://localhost:18000/diagnose/$eid" | tee /tmp/report.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/report.json"))
          assert r.get("root_cause"), r
          assert r.get("report_en") and r.get("report_ja"), r
          print("diagnose ok", r["root_cause"])
          PY
          curl -sf "http://localhost:18000/reports?limit=3" | tee /tmp/reports.json
      - name: Smoke evals
        run: |
          pip install -e .
          export DATABASE_URL=postgresql://fp:fp@localhost:15432/factorypulse
          export FP_OFFLINE_LLM=1
          python evals/run_evals.py --smoke 10
      - name: Tear down
        if: always()
        run: docker compose down -v

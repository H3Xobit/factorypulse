# Host ports are intentionally high to avoid clashing with common local stacks.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: fp
      POSTGRES_DB: factorypulse
    ports:
      - "15432:5432"
    volumes:
      - fp_pgdata:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/010-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d factorypulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "11883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://fp:fp@db:5432/factorypulse
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      FP_SEED: "42"
      FP_LOG_LEVEL: INFO
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FP_OFFLINE_LLM: ${FP_OFFLINE_LLM:-1}
    ports:
      - "18000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./evals:/app/evals:ro
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "13000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fp_pgdata:

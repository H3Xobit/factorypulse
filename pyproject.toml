[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorypulse"
version = "0.1.0"
description = "Multimodal anomaly triage copilot for manufacturing lines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "H3Xobit" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "paho-mqtt>=2.1.0",
  "numpy>=1.26.0",
  "scipy>=1.14.0",
  "scikit-learn>=1.5.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "sse-starlette>=2.1.0",
  "reportlab>=4.2.0",
  "pypdf>=5.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "anthropic>=0.39.0",
  "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
chrono = [
  "chronos-forecasting>=1.4.0",
  "torch>=2.4.0",
]
llm = [
  "anthropic>=0.39.0",
  "groq>=0.11.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "sentence-transformers>=3.3.0",
]
pdf = [
  "reportlab>=4.2.0",
]

[project.scripts]
fp-simulate = "factorypulse.simulator.replay:main"
fp-ingest = "factorypulse.ingestion.consumer:main"
fp-detect = "factorypulse.detection.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorypulse"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires docker services",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
